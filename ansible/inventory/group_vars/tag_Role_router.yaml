---
ansible_network_os: ios
ansible_connection: network_cli

ansible_user: "{{ router_admin_user | default('ec2-user') }}"
ansible_password: "{{ router_ssh_password }}"
ansible_ssh_private_key_file: null
# Add Vaulting for vars below
ansible_become: true
ansible_become_method: enable
ansible_become_password: "{{ vault_router_enable_password | default(omit) }}"

