---
- name: Show BGP summary
  cisco.ios.ios_command:
    commands:
      - show ip bgp summary
  register: cisco_router_bgp_summary

- name: Show learned routes
  cisco.ios.ios_command:
    commands:
      - show ip route bgp
  register: cisco_router_bgp_routes

- name: Display BGP summary
  ansible.builtin.debug:
    var: cisco_router_bgp_summary.stdout_lines

- name: Display BGP routes
  ansible.builtin.debug:
    var: cisco_router_bgp_routes.stdout_lines
