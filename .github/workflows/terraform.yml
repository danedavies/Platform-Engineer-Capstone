name: Terraform

on:
  pull_request:
    branches: [main]

  push:
    branches:
      - main
      - davidaltman920/dev

  workflow_dispatch:
    inputs:
      action:
        description: "Choose plan, apply, or destroy"
        required: true
        type: choice
        options: [plan, apply, destroy]

concurrency:
  group: terraform-network
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: ./terraform

jobs:

  plan:
    if: github.event_name == 'pull_request' ||
        github.event.inputs.action == 'plan' ||
        github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        working-directory: ./terraform  

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Lint
        run: tflint --no-color

      - name: Terraform Plan (binary)
        run: terraform plan -input=false -out=tfplan.binary

      - name: Terraform Plan (text for PR)
        run: terraform show -no-color tfplan.binary > tfplan.txt

      - name: Comment PR with plan diff
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('./terraform/tfplan.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `<details>
              <summary>Terraform Plan Diff (click to expand)</summary>

              \`\`\`
              ${plan}
              \`\`\`

              </details>`
            });

      - name: Upload binary plan for Apply
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./terraform/tfplan.binary

      - name: Check if tfplan.binary exists
        run: ls -l ./terraform


  apply:
    if: github.event.inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Download binary plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: .

      - name: Terraform Apply
        run: terraform apply -input=false tfplan.binary


  destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy --auto-approve
