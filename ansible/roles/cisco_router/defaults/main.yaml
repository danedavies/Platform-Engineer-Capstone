---
# Default values for the Cisco Catalyst 8000V Router placeholder

cisco_router_hostname: captsone-router
cisco_router_domain_name: capstone.local

cisco_router_physical_interface: GigabitEthernet1

cisco_router_vlans:
  - id: 10
    name: MGMT
    description: Management plane
    ip_address: 10.2.10.1
    netmask: 255.255.255.0

  - id: 20
    name: APP
    description: App tier - VPC1 10.0.0.0/16
    ip_address: 10.2.20.1
    netmask: 255.255.255.0

  - id: 30
    name: OBSERVABILITY
    description: Oberservability tier - VPC2 10.1.0.0/16
    ip_address: 10.2.30.1
    netmask: 255.255.255.0

cisco_router_enable_ip_routing: true

# Ensure config survives on reload with true, set false to leave changes in
cisco_router_save_config: true
