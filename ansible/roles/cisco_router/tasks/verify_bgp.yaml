- name: Show BGP summary
  cisco.ios.ios_command:
    commands:
      - show ip bgp summary
  register: bgp_summary

- name: Show learned routes
  cisco.ios.ios_command:
    commands:
      - show ip route bgp
  register: bgp_routes

- name: Display BGP summary
  debug:
    var: bgp_summary.stdout_lines

- name: Display BGP routes
  debug:
    var: bgp_routes.stdout_lines
